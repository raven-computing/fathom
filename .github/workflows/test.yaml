name: 'Test'
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-type-check:
    name: 'Type Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 'Performing static type checking'
        run: bash test.sh --types

  test-lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    needs: test-type-check
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 'Perform Static Code Analysis'
        run: bash test.sh --lint

  test-run-tests:
    name: '${{ matrix.os_label }}, ${{ matrix.python_version }}'
    runs-on: ${{ matrix.os }}
    needs: test-lint
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.14"]
        os: ["ubuntu-latest", "windows-latest"]
        include:
          - os: ubuntu-latest
            os_label: Linux

          - os: windows-latest
            os_label: Windows

    defaults:
      run:
        shell: bash

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 'Execute Unit Tests'
        run: bash test.sh --unit

      - name: 'Execute Integration Tests'
        run: bash test.sh --integration

      - name: 'Execute Functionality Tests'
        run: bash test.sh --functionality
